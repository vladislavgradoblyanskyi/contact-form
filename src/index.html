<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML forma</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>

    <main>
<!-- zawartosc strony -->
 <div class="tyl-strony">
      <div class="modalne" style="transform: translate(-50%, -50%);">
        <p class="modalne-p">Zostaw swoje dane</p>
        <form id="send">
          <div class="modalne-form-field">
            <label for="imie" class="label-name">Imię</label>
            <div class="modalne-input-sec">
              <input type="text" class="modalne-input" id="imie"  required/>
              <svg width="18" height="24" class="modalne-input-svg">
                <use href="./images/icons.svg#icon-vector"></use>
              </svg>
            </div>
          </div>
          <div class="modalne-form-field">
            <label for="nazwisko" class="label-name">Nazwisko</label>
            <div class="modalne-input-sec">
              <input type="text"  class="modalne-input" id="nazwisko" required/>
              <svg width="18" height="24" class="modalne-input-svg">
                <use href="./images/icons.svg#icon-vector"></use>
              </svg>
            </div>
          </div>
        
          <div class="modalne-form-field">
            <label for="email" class="label-name">Email</label>
            <div class="modalne-input-sec">
              <input type="email"  class="modalne-input" id="email" required/>
              <svg width="18" height="24" class="modalne-input-svg">
                <use href="./images/icons.svg#icon-vector-phone"></use>
              </svg>
            </div>

          <div class="modalne-form-textarea-pierwszy">
            <label for="komentarz" class="label-name">Temat Komentarza</label>
            <textarea name="user-comment" placeholder="wprowadz temat" class="modalne-textarea-pierwszy" id="Tematkomentarz" required></textarea>
          </div>

          <div class="modalne-form-textarea">
            <label for="komentarz" class="label-name">Komentarz</label>
            <textarea name="user-comment" placeholder="wprowadz tekst" class="modalne-textarea" id="komentarz" required></textarea>
          </div>

          <button type="submit" class="modalne-btn" >Wyslij</button>
        </form>
        <button type="button" class="modalne-btn"  id="tablica-btn">Pokaz tablice</button>
        <div id="messages"></div>
      </div>
    </div>

    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
